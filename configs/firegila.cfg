// Firegila autoconfig. Runs early, before extensions load.
// Grants the bundled uBlock Origin access to private windows.
// The shipped XPI stays signed, so nothing else is touched.
try {
  const { ExtensionPermissions } = ChromeUtils.importESModule(
    "resource://gre/modules/ExtensionPermissions.sys.mjs"
  );
  ExtensionPermissions.add("uBlock0@raymondhill.net", {
    permissions: ["internal:privateBrowsingAllowed"],
    origins: [],
  });
} catch (e) {}

// Sync stays account only. Bookmarks, shortcuts and the New Tab pinned list
// never cross devices. Autoconfig is used because policy prefs cannot lock
// services.sync prefs.
try {
  lockPref("services.sync.engine.bookmarks", false);
  lockPref("services.sync.engine.tabs", false);
  lockPref("services.sync.prefs.sync.browser.newtabpage.pinned", false);
} catch (e) {}
